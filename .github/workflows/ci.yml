name: Verify self-hosted backend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }

      - name: Check shell syntax
        run: find scripts -name '*.sh' -type f -print0 | xargs -0 -n1 bash -n

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./... -count=1

      - name: Build
        run: go build ./...

  release-jar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Test webview patcher
        run: node --test backend-go/scripts/patch-webviews.test.mjs

      - name: Verify patched JAR
        run: backend-go/scripts/verify-patched-jar.sh releases/intellij-augment-0.482.3-beta.jar
