name: Verify self-hosted backend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }

      - name: Check shell syntax
        run: find scripts -name '*.sh' -type f -print0 | xargs -0 -n1 bash -n

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./... -count=1

      - name: Build
        run: go build ./...

  release-jar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Verify JAR archive
        run: unzip -tq releases/intellij-augment-0.482.3-beta.jar

      - name: Verify plugin version metadata
        run: |
          plugin_version="$(unzip -p releases/intellij-augment-0.482.3-beta.jar META-INF/plugin.xml | sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p')"
          manifest_version="$(unzip -p releases/intellij-augment-0.482.3-beta.jar META-INF/MANIFEST.MF | sed -n 's/^Version: //p' | tr -d '\r')"
          test "$plugin_version" = "0.482.3-beta"
          test "$manifest_version" = "$plugin_version"

      - name: Verify bundled sidecar syntax
        run: |
          unzip -p releases/intellij-augment-0.482.3-beta.jar sidecar/index.cjs > "$RUNNER_TEMP/augment-sidecar.cjs"
          node --check "$RUNNER_TEMP/augment-sidecar.cjs"
