<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 600" width="440" height="600" role="img" aria-label="CodeAgent agent workspace: tool timeline and persistent task list">
<style>
  .s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
  .m{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  text{fill:#b8bcc2;font-size:12px}
  .pri{fill:#edeef0}.mut{fill:#6b737c}.sec{fill:#b0b4ba}
  .ok{fill:#41db91}.err{fill:#ff9592}.acc{fill:#70b8ff}
  .md{font-weight:500}.b{font-weight:700}
  .ic{fill:none;stroke:#b8bcc2;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .ic2{fill:none;stroke:#b0b4ba;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}

  @keyframes enter{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
  .in{animation:enter .45s cubic-bezier(.22,.7,.3,1) both}
  /* 8-leaf spinner: leaves fade on staggered delays over an 800ms cycle */
  @keyframes leaf{0%{opacity:1}100%{opacity:.25}}
  .lf{animation:leaf .8s linear infinite}
  /* "Generating response..." shimmer sweeps a bright band through the glyphs */
  @keyframes sweep{from{transform:translateX(-110px)}to{transform:translateX(110px)}}
  .sweep{animation:sweep 2.4s linear infinite}
  @keyframes sprite{0%,49%{opacity:1}50%,100%{opacity:0}}
  .fa{animation:sprite .25s steps(1) infinite}
  .fb{animation:sprite .25s steps(1) infinite reverse}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  .caret{animation:blink 1.1s step-end infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <g id="wand"><path d="M1 13 9 5M8 4l2 2M11 0v4M9 2h4M3 1v2M2 2h2"/></g>
  <g id="file"><path d="M2 0h6l3 3v8H2z"/><path d="M8 0v3h3"/></g>
  <g id="tick"><rect width="16" height="16" rx="4" fill="#263e59"/><g fill="none" stroke="#77c9f2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 7.4V8a5.5 5.5 0 1 1-3.3-5"/><path d="M5.4 7.6 7.6 9.8 13 4.4"/></g></g>
  <linearGradient id="shg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="110" y2="0" spreadMethod="repeat">
    <stop offset="0" stop-color="#777b84"/><stop offset=".5" stop-color="#edeef0"/><stop offset="1" stop-color="#777b84"/>
  </linearGradient>
  <clipPath id="genClip"><text class="s" x="40" y="504" font-size="12">Generating response...</text></clipPath>
</defs>
<rect width="440" height="600" fill="#2b2d30"/>

<!-- ══ header ══ -->
<g class="s">
  <g class="ic" transform="translate(14 14)"><path d="M0 2h14M0 7h14M0 12h14"/></g>
  <text x="40" y="24" class="pri b">Implement JWT login</text>
  <g class="ic" transform="translate(374 13)"><use href="#wand"/></g>
  <path d="M392 17l3 3 3-3" class="ic"/>
  <g class="ic" transform="translate(410 12)"><path d="M7 1v12M1 7h12"/></g>
  <path d="M0 39.5H440" stroke="#3e4347"/>
</g>

<!-- ══ Thread | Tasks | Edits ══ -->
<g class="s">
  <rect x="12" y="46" width="138" height="22" rx="4" fill="#393c40"/>
  <g class="ic" transform="translate(55 50)"><use href="#wand"/></g>
  <text x="76" y="61" class="pri md">Thread</text>
  <g class="ic2" transform="translate(183 51)"><path d="M0 2l2 2 3-4M0 9l2 2 3-4M8 3h6M8 10h6"/></g>
  <text x="206" y="61" class="sec md">Tasks</text>
  <rect x="245" y="50" width="28" height="14" rx="3" fill="#393c40"/>
  <text x="259" y="60.5" font-size="10" class="sec md" text-anchor="middle">2/5</text>
  <g class="ic2" transform="translate(313 51)"><path d="M2 0h7l3 3v11H2z"/><path d="M4.5 5.5h4M6.5 3.5v4M4.5 11h4"/></g>
  <text x="335" y="61" class="sec md">Edits</text>
  <rect x="368" y="50" width="27" height="14" rx="3" fill="#2a463c"/>
  <text x="381.5" y="60.5" font-size="10" class="ok md" text-anchor="middle">+42</text>
  <rect x="399" y="50" width="23" height="14" rx="3" fill="#502933"/>
  <text x="410.5" y="60.5" font-size="10" class="err md" text-anchor="middle">-6</text>
  <path d="M0 71.5H440" stroke="#3e4347"/>
</g>

<g class="s">
  <!-- user turn -->
  <g class="in">
    <rect x="12" y="84" width="416" height="38" rx="6" fill="#393c40"/>
    <text x="24" y="100">Implement JWT login on AuthController</text>
    <text x="24" y="115">and cover it with regression tests.</text>
  </g>

  <!-- ══ tool timeline: finished steps carry a small green dot, the live one a spinner ══ -->
  <g class="in" style="animation-delay:.3s">
    <rect x="12" y="132" width="416" height="26" rx="4" fill="#313437"/>
    <g transform="translate(22 138)"><rect width="12" height="12" rx="3" fill="#0090ff"/><path d="M3.4 8.6 6 3.4l2.6 5.2" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/></g>
    <text x="44" y="149" class="pri md">Augment Context Engine</text>
    <g class="ic2" transform="translate(206 141)" stroke-width="1.3"><path d="M3.5 1 0 4.5 3.5 8M8.5 1 12 4.5 8.5 8"/></g>
    <text x="224" y="149" class="sec" font-size="11">Codebase</text>
    <circle cx="414" cy="145" r="4" class="ok"/>
  </g>
  <g class="in" style="animation-delay:.8s">
    <rect x="12" y="166" width="416" height="26" rx="4" fill="#313437"/>
    <g class="ic" transform="translate(22 172)"><use href="#file"/></g>
    <text x="44" y="183" class="pri md">Read</text>
    <text x="80" y="183">AuthController.java <tspan class="mut">src/main/java</tspan></text>
    <circle cx="414" cy="179" r="4" class="ok"/>
  </g>
  <g class="in" style="animation-delay:1.3s">
    <rect x="12" y="200" width="416" height="26" rx="4" fill="#313437"/>
    <g class="ic" transform="translate(22 206)"><circle cx="5" cy="5" r="4.5"/><path d="M8.5 8.5 12 12"/></g>
    <text x="44" y="217" class="pri md">Grep Search</text>
    <text x="122" y="217" class="m sec" font-size="11">jwtEncoder</text>
    <circle cx="414" cy="213" r="4" class="ok"/>
  </g>
  <g class="in" style="animation-delay:1.8s">
    <rect x="12" y="234" width="416" height="26" rx="4" fill="#313437"/>
    <g class="ic" transform="translate(22 240)"><use href="#file"/><path d="M4.5 8 8 4.5l1 1L6 9z"/></g>
    <text x="44" y="251" class="pri md">Edited file</text>
    <text x="112" y="251">AuthController.java</text>
    <rect x="340" y="240" width="27" height="14" rx="3" fill="#2a463c"/>
    <text x="353.5" y="250.5" font-size="10" class="ok md" text-anchor="middle">+24</text>
    <rect x="371" y="240" width="23" height="14" rx="3" fill="#502933"/>
    <text x="382.5" y="250.5" font-size="10" class="err md" text-anchor="middle">-6</text>
    <circle cx="414" cy="247" r="4" class="ok"/>
  </g>
  <g class="in" style="animation-delay:2.3s">
    <rect x="12" y="268" width="416" height="26" rx="4" fill="#313437"/>
    <g class="ic" transform="translate(22 274)"><use href="#file"/><path d="M6.5 5.5v4M4.5 7.5h4"/></g>
    <text x="44" y="285" class="pri md">Created file</text>
    <text x="120" y="285">AuthControllerTest.java</text>
    <rect x="368" y="274" width="27" height="14" rx="3" fill="#2a463c"/>
    <text x="381.5" y="284.5" font-size="10" class="ok md" text-anchor="middle">+18</text>
    <circle cx="414" cy="281" r="4" class="ok"/>
  </g>
  <g class="in" style="animation-delay:2.8s">
    <rect x="12" y="302" width="416" height="26" rx="4" fill="#313437"/>
    <g class="ic" transform="translate(22 308)"><rect x="1" y="1.5" width="12" height="9.5" rx="1.5"/><path d="M3.5 5l2 1.5-2 1.5M7.5 8.5h3"/></g>
    <text x="44" y="319" class="pri md">Terminal</text>
    <text x="104" y="319" class="m sec" font-size="11">$ ./gradlew test --tests AuthTest</text>
    <g transform="translate(414 315)" stroke="#b0b4ba" stroke-width="1.6" stroke-linecap="round" opacity=".65">
      <path d="M0 -5.5V-3" class="lf"/>
      <path d="M3.9 -3.9 2.1 -2.1" class="lf" style="animation-delay:-.1s"/>
      <path d="M5.5 0H3" class="lf" style="animation-delay:-.2s"/>
      <path d="M3.9 3.9 2.1 2.1" class="lf" style="animation-delay:-.3s"/>
      <path d="M0 5.5V3" class="lf" style="animation-delay:-.4s"/>
      <path d="M-3.9 3.9-2.1 2.1" class="lf" style="animation-delay:-.5s"/>
      <path d="M-5.5 0H-3" class="lf" style="animation-delay:-.6s"/>
      <path d="M-3.9 -3.9-2.1 -2.1" class="lf" style="animation-delay:-.7s"/>
    </g>
  </g>

  <!-- ══ Update Task List card, expanded: the tree is the card body ══ -->
  <g class="in" style="animation-delay:3.3s">
    <rect x="12" y="336" width="416" height="146" rx="4" fill="#313437"/>
    <g class="ic2" transform="translate(22 343)"><path d="M0 2l2 2 3-4M0 9l2 2 3-4M8 3h6M8 10h6"/></g>
    <text x="44" y="353" class="pri md">Update Task List</text>
    <rect x="352" y="342" width="28" height="14" rx="3" fill="#393c40"/>
    <g transform="translate(356 345)" fill="none" stroke="#b8bcc2" stroke-width="1.2" stroke-linecap="round"><circle cx="4" cy="4" r="3.4" stroke-dasharray="1.8 1.5"/><path d="M4 2.5v3M2.5 4h3"/></g>
    <text x="372" y="352.5" font-size="10" class="md" text-anchor="middle">3</text>
    <rect x="384" y="342" width="28" height="14" rx="3" fill="#393c40"/>
    <g transform="translate(388 345)" fill="none" stroke="#b8bcc2" stroke-width="1.2" stroke-linecap="round"><circle cx="4" cy="4" r="3.4" stroke-dasharray="1.8 1.5"/><path d="M4 5.6V2.6M2.7 3.9 4 2.6l1.3 1.3"/></g>
    <text x="404" y="352.5" font-size="10" class="md" text-anchor="middle">2</text>
    <circle cx="422" cy="349" r="4" class="ok"/>
    <path d="M12 362.5h416" stroke="#2b2d30"/>

    <!-- tree connector rail -->
    <path d="M32.5 378v84" stroke="#444950"/>
    <use href="#tick" x="26" y="370"/>
    <text x="50" y="382">Inspect the existing authentication flow</text>
    <use href="#tick" x="26" y="392"/>
    <text x="50" y="404">Implement JWT token issuance</text>
    <!-- in progress: circle-dot-dashed -->
    <g transform="translate(26 414)" fill="none" stroke="#b8bcc2" stroke-width="1.5" stroke-linecap="round">
      <circle cx="8" cy="8" r="6.5" stroke-dasharray="3 2.2"/><circle cx="8" cy="8" r="1.7" fill="#b8bcc2" stroke="none"/>
    </g>
    <text x="50" y="426" class="pri md">Add invalid-credential regression coverage</text>
    <!-- not started: circle-dashed -->
    <g transform="translate(26 436)" fill="none" stroke="#6b737c" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="6.5" stroke-dasharray="3 2.2"/></g>
    <text x="50" y="448" class="mut">Run the focused integration suite</text>
    <g transform="translate(26 458)" fill="none" stroke="#6b737c" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="6.5" stroke-dasharray="3 2.2"/></g>
    <text x="50" y="470" class="mut">Update the API reference</text>
  </g>

  <!-- ══ live status row: pixel sprite + shimmering label + elapsed badge ══ -->
  <g class="in" style="animation-delay:3.9s">
    <g transform="translate(20 495)" fill="#b0b4ba">
      <g class="fa"><rect x="2" width="2" height="2"/><rect x="6" width="2" height="2"/><rect y="2" width="10" height="2"/><rect y="4" width="2" height="2"/><rect x="8" y="4" width="2" height="2"/><rect x="2" y="6" width="6" height="2"/></g>
      <g class="fb"><rect width="2" height="2"/><rect x="8" width="2" height="2"/><rect y="2" width="10" height="2"/><rect x="2" y="4" width="6" height="2"/><rect y="6" width="2" height="2"/><rect x="8" y="6" width="2" height="2"/></g>
    </g>
    <text x="40" y="504" fill="#777b84">Generating response...</text>
    <g clip-path="url(#genClip)"><rect x="0" y="490" width="440" height="20" fill="url(#shg)" class="sweep"/></g>
    <rect x="382" y="492" width="34" height="16" rx="8" fill="#393c40"/>
    <text x="399" y="504" class="m sec" font-size="11" text-anchor="middle">0:07</text>
  </g>
</g>

<!-- ══ composer ══ -->
<g class="s">
  <rect x="12.5" y="526.5" width="415" height="61" rx="4" fill="none" stroke="#444950"/>
  <path d="M13 527h414v20H13z" fill="#313437"/>
  <g class="ic" transform="translate(21 532)"><path d="M5 1v8M1 5h8"/></g>
  <rect x="38" y="531" width="150" height="14" rx="7" fill="#393c40"/>
  <g class="ic" transform="translate(45 534)" stroke-width="1.3"><path d="M1.5 0h4l2 2v6h-6z"/></g>
  <text x="59" y="541.5" font-size="10">AuthController.java</text>
  <path d="M174 535l6 6M180 535l-6 6" stroke="#6b737c" stroke-width="1.2" stroke-linecap="round"/>
  <text x="22" y="564" class="mut">Ask or Instruct Augment</text>
  <rect x="22" y="555" width="1.4" height="12" fill="#b8bcc2" class="caret"/>
  <g transform="translate(22 570)">
    <rect width="52" height="16" rx="8" fill="#213e5f"/>
    <text x="8" y="11.5" font-size="10" class="acc md">Auto</text>
    <circle cx="43" cy="8" r="5" fill="#70b8ff"/>
    <text x="64" y="12" font-size="11" class="sec">claude-sonnet-4-5</text>
    <path d="M176 9l3 3 3-3" class="ic" stroke="#6b737c" stroke-width="1.3"/>
  </g>
  <g transform="translate(370 570)">
    <g class="ic" stroke-width="1.4"><path d="M4 3v10M-1 8h10"/></g>
    <rect x="22" width="26" height="16" rx="8" fill="#0090ff"/>
    <path d="M29 8h11M36 4l4 4-4 4" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</g>
</svg>
