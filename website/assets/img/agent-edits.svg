<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 318" width="440" height="318" role="img" aria-label="CodeAgent Edits tab: changed files, per-file undo and restorable checkpoints">
<style>
  .s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
  text{fill:#b8bcc2;font-size:12px}
  .pri{fill:#edeef0}.mut{fill:#6b737c}.sec{fill:#b0b4ba}
  .ok{fill:#41db91}.err{fill:#ff9592}.acc{fill:#70b8ff}
  .md{font-weight:500}.b{font-weight:700}
  .ic{fill:none;stroke:#b8bcc2;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .ic2{fill:none;stroke:#b0b4ba;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}

  @keyframes enter{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
  .in{animation:enter .45s cubic-bezier(.22,.7,.3,1) both}
  /* the hover affordance cycles so the Open File / Undo buttons read as revealed on hover */
  @keyframes hov{0%,18%{opacity:0}26%,62%{opacity:1}70%,100%{opacity:0}}
  .hov{animation:hov 7s ease-in-out infinite both}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  /* every glyph is a 16x16 box with its artwork centred, so one placement rule aligns all */
  .i{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;color:#b8bcc2}
</style>
<defs>
  <g id="ico-file"><path d="M3 2h6l4 4v8H3z"/><path d="M9 2v4h4"/></g>
  <g id="ico-wand"><path d="M2.5 13.5 10 6"/><path d="M9 5l1.5 1.5"/><path d="M12 2.5v3"/><path d="M10.5 4h3"/><path d="M3.5 2.5v2"/><path d="M2.5 3.5h2"/></g>
  <g id="ico-menu"><path d="M2 4.5h12"/><path d="M2 8h12"/><path d="M2 11.5h12"/></g>
  <g id="ico-plus"><path d="M8 2.5v11"/><path d="M2.5 8h11"/></g>
  <g id="ico-chev-d"><path d="M4.5 6.5 8 10l3.5-3.5"/></g>
  <g id="ico-checks"><path d="M2 4.6l1.6 1.6L6.6 2.8"/><path d="M2 11.4l1.6 1.6L6.6 9.6"/><path d="M9 5.2h5"/><path d="M9 12h5"/></g>
  <g id="ico-file-diff"><path d="M3 2h6l4 4v8H3z"/><path d="M9 2v4h4"/><path d="M6.2 9h3.6"/><path d="M8 7.2v3.6"/><path d="M6.2 12h3.6"/></g>
  <g id="ico-milestone"><path d="M2.6 2.5h8l3 3-3 3h-8z"/><path d="M2.6 8.5v5"/></g>
  <g id="ico-external"><path d="M6.5 2.5h7v7"/><path d="M13.5 2.5 7 9"/><path d="M11 10v3.5H2.5V5H6"/></g>
  <g id="ico-undo"><path d="M4 5.6h6.4a3.4 3.4 0 1 1 0 6.8H6.4"/><path d="M6.6 2.6 3.6 5.6l3 3"/></g>
</defs>
<rect width="440" height="318" fill="#2b2d30"/>

<!-- ══ header ══ -->
<g class="s">
  <use class="i" href="#ico-menu" x="14" y="12"/>
  <text x="40" y="24" class="pri b">Implement JWT login</text>
  <use class="i" href="#ico-wand" x="372" y="12"/>
  <use class="i" href="#ico-chev-d" x="386" y="12"/>
  <use class="i" href="#ico-plus" x="406" y="12"/>
  <path d="M0 39.5H440" stroke="#3e4347"/>
</g>

<!-- ══ tab strip with Edits active ══ -->
<g class="s">
  <rect x="290" y="46" width="138" height="22" rx="4" fill="#393c40"/>
  <use class="i" href="#ico-wand" x="53" y="49" style="color:#b0b4ba"/>
  <text x="76" y="61" class="sec md">Thread</text>
  <use class="i" href="#ico-checks" x="181" y="49" style="color:#b0b4ba"/>
  <text x="206" y="61" class="sec md">Tasks</text>
  <rect x="245" y="50" width="28" height="14" rx="3" fill="#393c40"/>
  <text x="259" y="60.5" font-size="10" class="sec md" text-anchor="middle">5/5</text>
  <use class="i" href="#ico-file-diff" x="301" y="49"/>
  <text x="325" y="61" class="pri md">Edits</text>
  <rect x="360" y="50" width="27" height="14" rx="3" fill="#2a463c"/>
  <text x="373.5" y="60.5" font-size="10" class="ok md" text-anchor="middle">+42</text>
  <rect x="391" y="50" width="23" height="14" rx="3" fill="#502933"/>
  <text x="402.5" y="60.5" font-size="10" class="err md" text-anchor="middle">-6</text>
  <path d="M0 71.5H440" stroke="#3e4347"/>
</g>

<g class="s">
  <!-- ══ sticky bulk controls: Discard All | Keep All ══ -->
  <g class="in">
    <rect x="12" y="82" width="204" height="22" rx="3" fill="#393c40"/>
    <text x="100" y="97" class="md" text-anchor="middle">Discard All</text>
    <g transform="translate(156 85)"><path d="M2.6 4.4h10.8M5.8 4.4V2.6h4.4v1.8M4 4.4l.8 9h6.4l.8-9" class="i" style="stroke-width:1.4"/></g>
    <rect x="224" y="82" width="204" height="22" rx="3" fill="#213e5f"/>
    <g transform="translate(288 88)" fill="none" stroke="#70b8ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M0 5l3 3 5.5-6.5M6 8l.8.8 5.5-6.5"/></g>
    <text x="320" y="97" class="acc md">Keep All</text>
  </g>

  <!-- ══ changed-file rows; the first is shown hovered ══ -->
  <g class="in" style="animation-delay:.25s">
    <rect x="12" y="114" width="416" height="28" rx="4" fill="#393c40"/>
    <use class="i" href="#ico-file" x="22" y="120" style="color:#e08a3c"/>
    <text x="44" y="132">AuthController.java <tspan class="mut">src/main/java/auth</tspan></text>
    <g class="hov">
      <use class="i" href="#ico-external" x="318" y="120" style="color:#b0b4ba"/>
      <use class="i" href="#ico-undo" x="344" y="120" style="color:#b0b4ba"/>
    </g>
    <rect x="372" y="121" width="27" height="14" rx="3" fill="#2a463c"/>
    <text x="385.5" y="131.5" font-size="10" class="ok md" text-anchor="middle">+24</text>
    <rect x="403" y="121" width="23" height="14" rx="3" fill="#502933"/>
    <text x="414.5" y="131.5" font-size="10" class="err md" text-anchor="middle">-6</text>
  </g>
  <g class="in" style="animation-delay:.4s">
    <use class="i" href="#ico-file" x="22" y="148" style="color:#e08a3c"/>
    <text x="44" y="160">AuthControllerTest.java <tspan class="mut">src/test/java/auth</tspan></text>
    <rect x="372" y="149" width="27" height="14" rx="3" fill="#2a463c"/>
    <text x="385.5" y="159.5" font-size="10" class="ok md" text-anchor="middle">+18</text>
  </g>
  <g class="in" style="animation-delay:.55s">
    <use class="i" href="#ico-file" x="22" y="176" style="color:#5fa8d3"/>
    <text x="44" y="188">application.yml <tspan class="mut">src/main/resources</tspan></text>
    <rect x="379" y="177" width="20" height="14" rx="3" fill="#2a463c"/>
    <text x="389" y="187.5" font-size="10" class="ok md" text-anchor="middle">+3</text>
  </g>

  <!-- ══ checkpoint: collapsible with a Revert affordance ══ -->
  <g class="in" style="animation-delay:.8s">
    <rect x="12" y="206" width="416" height="98" rx="4" fill="#313437"/>
    <use class="i" href="#ico-milestone" x="22" y="212"/>
    <text x="44" y="224" class="pri md">Checkpoint 3 <tspan fill="#b8bcc2" font-weight="400" opacity=".8">(2 files)</tspan></text>
    <text x="180" y="224" class="mut">Reverted to Checkpoint 2</text>
    <use class="i" href="#ico-undo" x="344" y="212" style="color:#b0b4ba"/>
    <text x="366" y="224" class="sec">Revert</text>
    <path d="M12 234.5h416" stroke="#2b2d30"/>
    <use class="i" href="#ico-file" x="26" y="244" style="color:#e08a3c"/>
    <text x="48" y="256">SecurityConfig.java <tspan class="mut">src/main/java/auth</tspan></text>
    <rect x="379" y="245" width="20" height="14" rx="3" fill="#2a463c"/>
    <text x="389" y="255.5" font-size="10" class="ok md" text-anchor="middle">+9</text>
    <use class="i" href="#ico-file" x="26" y="272" style="color:#8fb573"/>
    <text x="48" y="284">TokenClaims.java <tspan class="mut">src/main/java/auth</tspan></text>
    <rect x="375" y="273" width="24" height="14" rx="3" fill="#2a463c"/>
    <text x="387" y="283.5" font-size="10" class="ok md" text-anchor="middle">+12</text>
  </g>
</g>
</svg>
