<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 332" width="440" height="332" role="img" aria-label="CodeAgent Project Home: workspace stats, language breakdown and codebase indexing progress">
<style>
  .s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
  text{fill:#b8bcc2;font-size:12px}
  .pri{fill:#fff}.mut{fill:#6b737c}.sec{fill:#b0b4ba}.n10{fill:#777b84}
  .md{font-weight:500}
  .ic{fill:none;stroke:#b8bcc2;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

  @keyframes enter{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
  .in{animation:enter .45s cubic-bezier(.22,.7,.3,1) both}
  /* the indexing icon spins counter-clockwise, 2s linear, exactly as ds-spin-reverse does */
  @keyframes spinr{to{transform:rotate(-360deg)}}
  .spinr{animation:spinr 2s linear infinite;transform-origin:8px 8px}
  /* determinate progress eases to its value with the real .4s cubic-bezier curve */
  @keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .fill{animation:fill .9s cubic-bezier(.4,0,.2,1) both;transform-origin:left center}
  @keyframes full{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .full{animation:full .9s cubic-bezier(.4,0,.2,1) both;transform-origin:left center}
  /* NumberFlow odometer: digits roll into place */
  @keyframes roll{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
  .roll{animation:roll .6s cubic-bezier(.22,.7,.3,1) both}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  /* every glyph is a 16x16 box with its artwork centred, so one placement rule aligns all */
  .i{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;color:#b8bcc2}
</style>
<defs>
  <g id="ico-menu"><path d="M2 4.5h12"/><path d="M2 8h12"/><path d="M2 11.5h12"/></g>
  <g id="ico-user"><path d="M8 3a2.6 2.6 0 1 1 0 5.2A2.6 2.6 0 0 1 8 3"/><path d="M2.6 14a5.4 5.4 0 0 1 10.8 0"/></g>
  <g id="ico-folder"><path d="M1.8 4.4h4.1l1.5 2h6.8v6.4H1.8z"/><path d="M3.8 4.4V2.9h3l1.5 1.5"/></g>
  <g id="ico-wand"><path d="M2.5 13.5 10 6"/><path d="M9 5l1.5 1.5"/><path d="M12 2.5v3"/><path d="M10.5 4h3"/><path d="M3.5 2.5v2"/><path d="M2.5 3.5h2"/></g>
  <g id="ico-refresh"><path d="M1.6 8a6.4 6.4 0 0 1 10.9-4.5"/><path d="M14.4 8A6.4 6.4 0 0 1 3.5 12.5"/><path d="M12.5 1.6v3.1H9.4"/><path d="M3.5 14.4v-3.1h3.1"/></g>
</defs>
<rect width="440" height="332" fill="#1e1f22"/>

<!-- ══ header: drawer trigger · breadcrumb · account ══ -->
<g class="s">
  <use class="i" href="#ico-menu" x="16" y="12"/>
  <text x="42" y="25" font-size="14" class="sec">Project Home</text>
  <use class="i" href="#ico-user" x="406" y="12"/>
</g>

<!-- ══ workspace name + Files / Threads stat cards ══ -->
<g class="s">
  <text x="16" y="86" font-size="30" class="pri">My Api</text>
  <g class="in">
    <rect x="216" y="48" width="102" height="76" rx="8" fill="#313437"/>
    <use class="i" href="#ico-folder" x="226" y="58" style="color:#b0b4ba"/>
    <text x="248" y="70" class="sec">Files</text>
    <g class="roll"><text x="228" y="110" font-size="28" class="pri">1,480</text></g>
  </g>
  <g class="in" style="animation-delay:.15s">
    <rect x="326" y="48" width="102" height="76" rx="8" fill="#313437"/>
    <use class="i" href="#ico-wand" x="336" y="58" style="color:#b0b4ba"/>
    <text x="358" y="70" class="sec">Threads</text>
    <g class="roll" style="animation-delay:.15s"><text x="338" y="110" font-size="28" class="pri">24</text></g>
  </g>
</g>

<!-- ══ Codebase ══ -->
<g class="s">
  <text x="16" y="154" font-size="16" class="pri">Codebase</text>

  <!-- languages: proportional bar + one badge per language -->
  <g class="in" style="animation-delay:.3s">
    <rect x="16" y="166" width="412" height="72" rx="8" fill="#313437"/>
    <text x="30" y="188" class="sec">Languages</text>
    <g class="full" style="animation-delay:.3s">
      <rect x="30" y="198" width="240" height="8" rx="4" fill="#5b5bd6"/>
      <rect x="272" y="198" width="84" height="8" rx="4" fill="#0090ff"/>
      <rect x="358" y="198" width="35" height="8" rx="4" fill="#12a594"/>
      <rect x="395" y="198" width="19" height="8" rx="4" fill="#696e77"/>
    </g>
    <g font-size="11">
      <rect x="30" y="216" width="72" height="15" rx="3" fill="#393c40"/>
      <text x="66" y="227" class="sec" text-anchor="middle">Java 62.4%</text>
      <rect x="108" y="216" width="80" height="15" rx="3" fill="#393c40"/>
      <text x="148" y="227" class="sec" text-anchor="middle">Kotlin 21.8%</text>
      <rect x="194" y="216" width="66" height="15" rx="3" fill="#393c40"/>
      <text x="227" y="227" class="sec" text-anchor="middle">SQL 9.1%</text>
      <rect x="266" y="216" width="72" height="15" rx="3" fill="#393c40"/>
      <text x="302" y="227" class="sec" text-anchor="middle">Other 6.7%</text>
    </g>
  </g>

  <!-- indexing progress -->
  <g class="in" style="animation-delay:.45s">
    <rect x="16" y="250" width="412" height="70" rx="4" fill="#18191b"/>
    <g transform="translate(30 262)"><use class="i spinr" href="#ico-refresh"/></g>
    <text x="56" y="275" font-size="14" class="md" fill="#edeef0">Indexing your codebase...</text>
    <rect x="32" y="288" width="380" height="6" rx="3" fill="#393c40"/>
    <rect x="32" y="288" width="258" height="6" rx="3" fill="#0090ff" class="fill" style="animation-delay:.45s"/>
    <text x="32" y="311" class="n10">68% complete</text>
  </g>
</g>
</svg>
