<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 500" width="1128" height="500" role="img" aria-label="CodeAgent running inside IntelliJ IDEA: the editor on the left, the agent panel streaming a tool timeline on the right">
<style>
  .s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
  .m{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  text{fill:#b8bcc2;font-size:12px}
  .kw{fill:#cf8e6d}.str{fill:#6aab73}.cmt{fill:#7a7e85}.num{fill:#2aacb8}
  .ann{fill:#b3ae60}.mth{fill:#56a8f5}.fld{fill:#c77dbb}.ln{fill:#4b5059}.code{fill:#bcbec4}
  .pri{fill:#edeef0}.mut{fill:#6b737c}.sec{fill:#b0b4ba}
  .ok{fill:#41db91}.err{fill:#ff9592}.acc{fill:#70b8ff}
  .md{font-weight:500}.b{font-weight:700}
  .ic{fill:none;stroke:#b8bcc2;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .ic2{fill:none;stroke:#b0b4ba;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}

  /* one shared entrance, staggered by animation-delay; equal duration keeps the loop aligned */
  @keyframes enter{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
  .in{animation:enter .45s cubic-bezier(.22,.7,.3,1) both}
  @keyframes leaf{0%{opacity:1}100%{opacity:.25}}
  .lf{animation:leaf .8s linear infinite}
  @keyframes sweep{from{transform:translateX(-110px)}to{transform:translateX(110px)}}
  .sweep{animation:sweep 2.4s linear infinite}
  @keyframes sprite{0%,49%{opacity:1}50%,100%{opacity:0}}
  .fa{animation:sprite .25s steps(1) infinite}
  .fb{animation:sprite .25s steps(1) infinite reverse}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  .caret{animation:blink 1.1s step-end infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <g id="wand"><path d="M1 13 9 5M8 4l2 2M11 0v4M9 2h4M3 1v2M2 2h2"/></g>
  <g id="file"><path d="M2 0h6l3 3v8H2z"/><path d="M8 0v3h3"/></g>
  <g id="tick"><rect width="16" height="16" rx="4" fill="#263e59"/><g fill="none" stroke="#77c9f2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 7.4V8a5.5 5.5 0 1 1-3.3-5"/><path d="M5.4 7.6 7.6 9.8 13 4.4"/></g></g>
  <clipPath id="editClip"><rect x="44" y="34" width="644" height="442"/></clipPath>
  <linearGradient id="shg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="110" y2="0" spreadMethod="repeat">
    <stop offset="0" stop-color="#777b84"/><stop offset=".5" stop-color="#edeef0"/><stop offset="1" stop-color="#777b84"/>
  </linearGradient>
  <clipPath id="genClip"><text class="s" x="728" y="390" font-size="12">Generating response...</text></clipPath>
</defs>

<rect width="1128" height="500" fill="#1e1f22"/>

