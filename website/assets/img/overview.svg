<g clip-path="url(#editClip)">
  <!-- the two lines the agent just wrote, in JetBrains "added" green -->
  <rect x="44" y="279" width="644" height="36" fill="#294436" class="in" style="animation-delay:3.6s"/>
  <rect x="44" y="279" width="3" height="36" fill="#5fad65" class="in" style="animation-delay:3.6s"/>

  <g class="m ln" font-size="11" text-anchor="end">
    <text x="76" y="58">14</text>
    <text x="76" y="76">15</text>
    <text x="76" y="94">16</text>
    <text x="76" y="112">17</text>
    <text x="76" y="130">18</text>
    <text x="76" y="148">19</text>
    <text x="76" y="166">20</text>
    <text x="76" y="184">21</text>
    <text x="76" y="202">22</text>
    <text x="76" y="220">23</text>
    <text x="76" y="238">24</text>
    <text x="76" y="256">25</text>
    <text x="76" y="274">26</text>
    <text x="76" y="292">27</text>
    <text x="76" y="310">28</text>
    <text x="76" y="328">29</text>
