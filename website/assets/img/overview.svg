    <text x="76" y="418">34</text>
    <text x="76" y="436">35</text>
    <text x="76" y="454">36</text>
  </g>

  <!-- indent via explicit x so alignment never depends on the viewer's mono metrics -->
  <g class="m code" font-size="12.5">
    <text x="94" y="58"><tspan class="ann">@RestController</tspan></text>
    <text x="94" y="76"><tspan class="ann">@RequestMapping</tspan>(<tspan class="str">"/api/auth"</tspan>)</text>
    <text x="94" y="94"><tspan class="kw">public class</tspan> AuthController {</text>
    <text x="124" y="130"><tspan class="kw">private final</tspan> AuthService <tspan class="fld">authService</tspan>;</text>
    <text x="124" y="148"><tspan class="kw">private final</tspan> JwtEncoder <tspan class="fld">jwtEncoder</tspan>;</text>
    <text x="124" y="184"><tspan class="ann">@PostMapping</tspan>(<tspan class="str">"/login"</tspan>)</text>
    <text x="124" y="202"><tspan class="kw">public</tspan> ResponseEntity&lt;TokenResponse&gt; <tspan class="mth">login</tspan>(</text>
    <text x="184" y="220"><tspan class="ann">@Valid</tspan> <tspan class="ann">@RequestBody</tspan> LoginRequest request) {</text>
    <text x="154" y="238">Authentication auth = <tspan class="fld">authService</tspan>.<tspan class="mth">authenticate</tspan>(request);</text>
    <text x="154" y="256"><tspan class="cmt">// issue a signed access token for the session</tspan></text>
    <text x="154" y="274"><tspan class="kw">var</tspan> claims = TokenClaims.<tspan class="mth">of</tspan>(auth, <tspan class="num">3600</tspan>);</text>
    <text x="154" y="292" class="in" style="animation-delay:3.7s"><tspan class="kw">String</tspan> token = <tspan class="fld">jwtEncoder</tspan>.<tspan class="mth">encode</tspan>(claims);</text>
    <text x="154" y="310" class="in" style="animation-delay:4s"><tspan class="kw">return</tspan> ResponseEntity.<tspan class="mth">ok</tspan>(<tspan class="kw">new</tspan> TokenResponse(token));</text>
    <text x="124" y="328">}</text>
    <text x="124" y="364"><tspan class="ann">@ExceptionHandler</tspan>(BadCredentialsException.<tspan class="kw">class</tspan>)</text>
    <text x="124" y="382"><tspan class="kw">public</tspan> ResponseEntity&lt;ApiError&gt; <tspan class="mth">onBadCredentials</tspan>() {</text>
    <text x="154" y="400"><tspan class="kw">return</tspan> ResponseEntity.<tspan class="mth">status</tspan>(UNAUTHORIZED)</text>
    <text x="214" y="418">.<tspan class="mth">body</tspan>(ApiError.<tspan class="mth">of</tspan>(<tspan class="str">"invalid_credentials"</tspan>));</text>
    <text x="124" y="436">}</text>
    <text x="94" y="454">}</text>
  </g>
  <rect x="531" y="299" width="1.6" height="14" fill="#bcbec4" class="caret in" style="animation-delay:4s"/>
</g>

<path d="M687.5 0V476" stroke="#393b40"/>

